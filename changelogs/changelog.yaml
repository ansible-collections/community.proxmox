  1.6.0:
    changes:
      bugfixes:
        - proxmox_cluster - make cluster join idempotent (https://github.com/ansible-collections/community.proxmox/pull/244).
        - proxmox_disk - make none iso disk idempotent (https://github.com/ansible-collections/community.proxmox/pull/288).
        - proxmox_firewall - Enable ipsets on vm level and fix bugs regarding the
          cidr notation the proxmox api expects (https://github.com/ansible-collections/community.proxmox/pull/248).
        - proxmox_role - when privs is omitted, keep existing role privileges unchanged
          instead of treating it as no privileges (https://github.com/ansible-collections/community.proxmox/pull/284).
      deprecated_features:
        - proxmox - Certificate verification default changes from ``false`` to ``true``
          with version 2.0.0 (https://github.com/ansible-collections/community.proxmox/pull/256).
      major_changes:
        - proxmox - Add ca_path option to specify a ca-certificate for tls validation
          (https://github.com/ansible-collections/community.proxmox/pull/256).
      minor_changes:
        - inventory plugin - add want_post_filtering_facts to delay fact gathering
          until filtering has completed (https://github.com/ansible-collections/community.proxmox/pull/261).
        - proxmox - Add api_timeout option for all modules (https://github.com/ansible-collections/community.proxmox/pull/253).
        - proxmox - set ``state`` as not ``required`` and set default value ``present``
          (https://github.com/ansible-collections/community.proxmox/pull/292).
        - proxmox_role - add role's privs on the return data (https://github.com/ansible-collections/community.proxmox/pull/283).
        - proxmox_storage - Add support for ZFS thin-provisioning (https://github.com/ansible-collections/community.proxmox/pull/265).
        - proxmox_storage - Add the option namespace for PBS storage (https://github.com/ansible-collections/community.proxmox/pull/282)
        - proxmox_storage - refactor the validation of storage options (https://github.com/ansible-collections/community.proxmox/pull/266).
        - proxmox_storage_contents_info - Add support for content type ``import``
          (https://github.com/ansible-collections/community.proxmox/pull/260).
        - proxmox_zone, proxmox_vnet, proxmox_subnet - make sdn modules compatible
          with pve8 (https://github.com/ansible-collections/community.proxmox/pull/254).
      release_summary: 'This is the minor release of the ``community.proxmox`` collection.

        This changelog contains all changes to the modules and plugins in this collection

        that have been made after the previous release.'
    fragments:
      - 244-update-cluster-join.yml
