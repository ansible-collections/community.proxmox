  2.0.0:
    changes:
      breaking_changes:
        - proxmox_pool_member - move `member` parameter to a `members` list to manage
          multiple pool members at once. Add a new `exclusive` parameter to switch
          between full and incremental mode (https://github.com/ansible-collections/community.proxmox/pull/373
          / issue https://github.com/ansible-collections/community.proxmox/issues/320).
      bugfixes:
        - proxmox - fix ``tags`` always being reported as changed on LXC container
          updates because the list value was compared against Proxmox's semicolon-delimited
          string form (https://github.com/ansible-collections/community.proxmox/pull/415).
        - proxmox modules - fix calls to ``get_storages()`` to use the correct keyword
          argument (https://github.com/ansible-collections/community.proxmox/pull/401).
        - proxmox_firewall_info - add none guard on get_ip_sets to prevent crash with
          ``'NoneType' object has no attribute 'ipset'`` when using ``level=group``
          (https://github.com/ansible-collections/community.proxmox/issues/430).
        - proxmox_pool - member retrieval (https://github.com/ansible-collections/community.proxmox/pull/412).
        - proxmox_pool_member - fix pool membership operations failing for nested
          pool IDs (https://github.com/ansible-collections/community.proxmox/pull/428).
        - proxmox_pool_member - fix pool membership update (https://github.com/ansible-collections/community.proxmox/pull/428).
        - proxmox_pool_member - fix usage of storage member (https://github.com/ansible-collections/community.proxmox/pull/411).
        - proxmox_pool_member - member retrieval (https://github.com/ansible-collections/community.proxmox/pull/412).
      minor_changes:
        - proxmox - add ``destroy_unreferenced_disks`` parameter (https://github.com/ansible-collections/community.proxmox/pull/422).
        - proxmox - adds ``cmode`` parameter for supporting console modes (https://github.com/ansible-collections/community.proxmox/pull/420  /
          issue https://github.com/ansible-collections/community.proxmox/issues/65).
        - proxmox inventory - add ``templates`` group to the inventory (https://github.com/ansible-collections/community.proxmox/pull/399).
        - proxmox_acme_account - set ``no_log`` on sensitive value ``eab_kid`` (https://github.com/ansible-collections/community.proxmox/pull/418).
